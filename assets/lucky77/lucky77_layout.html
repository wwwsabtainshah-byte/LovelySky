<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}

html,body{
 margin:0;width:100%;min-height:100%;
 background:#050816;color:white;
 font-family:Arial,sans-serif;
}

.stage{
 position:relative;
 width:100%;
 min-height:100vh;
 overflow:hidden;
 padding:8px;
}

.area{
 position:relative;
 width:100%;
 margin:0 auto;
}

.wheel-area{
 height:310px;
}

.asset{
 position:absolute;
 object-fit:contain;
 max-width:none;
}

/* WHEEL BASE */
#wheel_base{
 width:88%;
 height:88%;
 left:6%;
 top:3%;
}

/* ROTATING DISC */
#disc{
 width:63%;
 height:63%;
 left:18.5%;
 top:15%;
 transform-origin:center;
}

/* FOUR WHEEL PARTS */
#part_a{width:30%;height:30%;left:5%;top:5%}
#part_b{width:30%;height:38%;right:5%;top:5%}
#part_c{width:30%;height:30%;left:5%;bottom:5%}
#part_d{width:30%;height:38%;right:5%;bottom:5%}

/* FOUR HUBS - INDEPENDENT */
.hub-area{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 height:100px;
 margin:5px 0 12px;
}
.hub-item{
 position:relative;
 min-width:0;
}
.hub-item img{
 width:100%;
 height:100%;
 object-fit:contain;
}

/* ORIGINAL THREE 3D BUTTONS */
.button-area{
 position:relative;
 height:125px;
 width:100%;
}
#buttons{
 position:absolute;
 width:96%;
 height:100%;
 left:2%;
 top:0;
 object-fit:contain;
}

/* FOUR CHIPS */
.chip-area{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 height:90px;
 margin-top:8px;
}
.chip-item{
 position:relative;
 min-width:0;
}
.chip-item img{
 width:100%;
 height:100%;
 object-fit:contain;
}

/* EACH ASSET HAS ITS OWN POSITION/SIZE CONTROL */
</style>
</head>

<body>
<div class="stage">

  <!-- COMPLETE WHEEL -->
  <div class="area wheel-area">
    <img class="asset" id="wheel_base"
      src="layered/wheel_base.png">

    <img class="asset" id="disc"
      src="layered/disc.png">

    <img class="asset" id="part_a"
      src="layered/part_a.png">

    <img class="asset" id="part_b"
      src="layered/part_b.png">

    <img class="asset" id="part_c"
      src="layered/part_c.png">

    <img class="asset" id="part_d"
      src="layered/part_d.png">
  </div>

  <!-- FOUR INDEPENDENT HUB ASSETS -->
  <div class="hub-area">
    <div class="hub-item">
      <img id="hub_a" src="layered/hub_a.png">
    </div>
    <div class="hub-item">
      <img id="hub_b" src="layered/hub_b.png">
    </div>
    <div class="hub-item">
      <img id="hub_c" src="layered/hub_c.png">
    </div>
    <div class="hub-item">
      <img id="hub_d" src="layered/hub_d.png">
    </div>
  </div>

  <!-- ORIGINAL FULL 3D BUTTON SHEET -->
  <div class="button-area">
    <img id="buttons"
      src="layered/buttons_transparent.png">
  </div>

  <!-- FOUR ORIGINAL CHIPS -->
  <div class="chip-area">
    <div class="chip-item">
      <img id="chip_1" src="layered/chips/chip_1.png">
    </div>
    <div class="chip-item">
      <img id="chip_2" src="layered/chips/chip_2.png">
    </div>
    <div class="chip-item">
      <img id="chip_3" src="layered/chips/chip_3.png">
    </div>
    <div class="chip-item">
      <img id="chip_4" src="layered/chips/chip_4.png">
    </div>
  </div>

</div>

<script>
window.spinWheel=function(degrees,duration=4000){
 const disc=document.getElementById('disc');
 disc.style.transition=
   `transform ${duration}ms cubic-bezier(.12,.72,.12,1)`;
 disc.style.transform=`rotate(${degrees}deg)`;
};

window.stopWheel=function(){
 const disc=document.getElementById('disc');
 disc.style.transition='none';
};

/* Individual asset positioning */
window.setAsset=function(id,settings){
 const el=document.getElementById(id);
 if(!el)return;
 if(settings.width)el.style.width=settings.width;
 if(settings.height)el.style.height=settings.height;
 if(settings.left)el.style.left=settings.left;
 if(settings.right)el.style.right=settings.right;
 if(settings.top)el.style.top=settings.top;
 if(settings.bottom)el.style.bottom=settings.bottom;
 if(settings.transform)el.style.transform=settings.transform;
};
</script>
</body>
</html>
